# Bidding systems a request can ask BEN to play or read, by the names of the Seat
# Robot API (ourSystem / theirSystem). GET / lists them, and the API only accepts
# names listed here. Paths are relative to the BEN folder, like the other configs.
#
#   bidder  the bidding network. Used for us and partner when the system is ours,
#           and as the opponent model when it is theirs.
#   info    the bidding-info network (HCP and shape from the auction). Needed for a
#           system BEN plays. For a system BEN reads it is optional: sampling then takes
#           the opponents' HCP and shape from it.
#   cc      the BBA convention card (explanations, ace counting, BBA consultation)
#   plays   True: BEN can play it (ourSystem). False: BEN can only read it (theirSystem).
#
# The shared names are defined in the Seat Robot API. Names with the BEN: prefix are
# BEN's own and are read with models trained to imitate that robot.

[21GF-GIB]
bidder = models/torch/GIB-BBO-8742_2026-10-23-E30.pt
info = models/torch/GIB-BBO-8742-Info_2026-10-23-E30.pt
cc = BBA/CC/GIB-BBO.bbsa
plays = True

